<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DANIO — Interactive Specimen Poster</title>
<style>
  /* ============================================================
     DANIO — interactive fluorescent-zebrafish poster
     Single file. No external CSS/JS. Vanilla canvas only.
     Art direction: editorial print plate. Centerpiece is a live
     specimen rendered as a mosaic of glowing pixels that scatter
     away from the cursor and ease back into formation.
     ============================================================ */

  :root{
    /* print margin of the "physical" poster */
    --pad: clamp(18px, 3.4vmin, 46px);
    /* type colours */
    --ink:        #ffffff;
    --ink-soft:   rgba(255,255,255,0.82);
    --ink-faint:  rgba(255,255,255,0.42);
    --hairline:   rgba(255,255,255,0.13);
    --sans: "Helvetica Neue", Helvetica, Arial, "Segoe UI", sans-serif;
    --serif: "Didot", "Bodoni MT", "Playfair Display", Georgia, "Times New Roman", serif;
  }

  *{ box-sizing: border-box; }
  html, body{ height: 100%; }
  body{
    margin: 0;
    background: #000;
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* The poster fills the viewport; the frame is the printed plate. */
  .poster{
    position: fixed;
    inset: 0;
    padding: var(--pad);
  }
  .frame{
    position: relative;
    width: 100%;
    height: 100%;
    border: 1px solid var(--hairline);
    /* faint inner vignette so the black plate reads as a surface */
    box-shadow: inset 0 0 140px rgba(255,255,255,0.015);
    overflow: hidden;
  }

  /* The interactive specimen lives on the canvas, filling the plate. */
  #stage{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
    touch-action: none;          /* let us own touch gestures */
    z-index: 1;
  }

  /* All text overlays the canvas but never blocks the cursor. */
  .layer{
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  /* ---- Top-left wordmark -------------------------------------- */
  .title{
    position: absolute;
    top: clamp(6px, 2vmin, 26px);
    left: clamp(10px, 2.2vmin, 30px);
    margin: 0;
    font-family: var(--serif);
    font-weight: 700;
    text-transform: uppercase;
    line-height: 0.84;
    letter-spacing: -0.012em;
    font-size: clamp(3.1rem, 12vw, 9.5rem);
    /* glossy metallic vertical gradient, like a foil-stamped title */
    background: linear-gradient(177deg,
                #ffffff 0%, #f4f4f4 34%, #b9b9b9 60%, #efefef 82%, #cfcfcf 100%);
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
            color: transparent;
    filter: drop-shadow(0 2px 22px rgba(255,255,255,0.10));
  }

  /* ---- Top-right tagline -------------------------------------- */
  .tagline{
    position: absolute;
    top: clamp(8px, 2.2vmin, 30px);
    right: clamp(10px, 2.2vmin, 32px);
    margin: 0;
    text-align: right;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-size: clamp(0.6rem, 0.95vw, 0.8rem);
    letter-spacing: 0.24em;
    line-height: 1.7;
  }

  /* ---- Bottom-left sub-details -------------------------------- */
  .meta{
    position: absolute;
    left: clamp(10px, 2.2vmin, 30px);
    bottom: clamp(8px, 2.2vmin, 28px);
    margin: 0;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-size: clamp(0.6rem, 0.95vw, 0.8rem);
    letter-spacing: 0.24em;
    line-height: 1.7;
  }

  /* ---- Bottom-right plate stamp ------------------------------- */
  .stamp{
    position: absolute;
    right: clamp(10px, 2.2vmin, 32px);
    bottom: clamp(8px, 2.2vmin, 28px);
    margin: 0;
    text-transform: uppercase;
    text-align: right;
    color: var(--ink-faint);
    font-size: clamp(0.52rem, 0.8vw, 0.7rem);
    letter-spacing: 0.34em;
    line-height: 1.7;
  }

  /* ---- Left rail rotated date --------------------------------- */
  .rail{
    position: absolute;
    left: clamp(6px, 1.4vmin, 18px);
    top: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .rail .date{
    transform: rotate(-90deg);
    white-space: nowrap;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-size: clamp(0.55rem, 0.82vw, 0.72rem);
    letter-spacing: 0.42em;
  }

  /* ---- Figure caption beneath the specimen -------------------- */
  .caption{
    position: absolute;
    left: 50%;
    bottom: clamp(8px, 4.5vmin, 54px);
    transform: translateX(-50%);
    margin: 0;
    text-transform: uppercase;
    text-align: center;
    color: var(--ink-faint);
    font-size: clamp(0.52rem, 0.82vw, 0.72rem);
    letter-spacing: 0.34em;
    white-space: nowrap;
  }
  .caption b{
    color: var(--ink-soft);
    font-weight: 400;
  }

  /* Tighten the layout on small screens so nothing collides. */
  @media (max-width: 560px){
    .tagline, .meta{ font-size: 0.58rem; letter-spacing: 0.2em; line-height: 1.6; }
    .stamp{ display: none; }            /* avoid clutter on phones */
    .caption{ display: none; }          /* would collide with footer on narrow screens */
    .title{ line-height: 0.9; }
  }
  @media (max-height: 480px){
    .caption{ display:none; }
  }
</style>
</head>

        <p class="tagline">
          WATCH BIOLOGY<br>
          UNFOLD IN<br>
          LIVING COLOR
        </p>

        <p class="meta">
          IN VIVO IMAGING<br>
          REGENERATIVE MEDICINE
        </p>

        <p class="stamp">
          PLATE I<br>
          FLUORESCENCE
        </p>

        <div class="rail"><span class="date">06 / 13 / 2026</span></div>

        <p class="caption"><b>FIG. 01</b> &nbsp;—&nbsp; DANIO RERIO &nbsp;·&nbsp; LIVE FLUORESCENCE</p>
      </div>
    </div>
  </main>

<script>
"use strict";
/* ================================================================
   DANIO — a living fluorescent-zebrafish specimen, rendered as an
   interactive mosaic of light on a black editorial plate.

   HOW THE MOTION WORKS (read before tuning):
   • Every frame of a short swim clip is baked into one vertical sprite
     sheet image, embedded inline. At load we decode each frame into its
     own pixel buffer.
   • The mosaic is a FIXED grid of rounded-square cells. Every animation
     frame we look up the two nearest sheet frames and blend them, so each
     cell continuously samples the colour + brightness of the fish beneath
     it. The grid never moves — the luminous body flows underneath it, and
     THAT reads as swimming. The frame index ping-pongs (forward then back)
     for a perfectly seamless, slow loop.
   • On top of that, each cell is a little spring: the cursor shoves cells
     aside (with a tangential swirl for fluid scatter) and they ease back
     home. Disturbed cells brighten and swell, then calm.
   • A screen-space bloom adds the glow; its cost is independent of the
     number of cells.
   ================================================================ */

const CONFIG = {
  // --- mosaic ---
  gridCols:      110,    // render resolution. The sheet is GRID_COLS×GRID_ROWS per
                         // frame (baked below); set this LOWER than GRID_COLS to
                         // thin the grid into fewer/chunkier cells on weak GPUs.
  cellGap:       0.16,   // gap between cells, fraction of a cell (0=touching, 0.3=airy)
  cornerRadius:  0.26,   // rounded-square corner radius, fraction of cell size
  fitFraction:   0.90,   // share of the plate the (16:9) specimen field fills

  // --- animation ---
  framesPerSec:  6.0,    // playback speed of the swim. ~6 ≈ a languid ~40s ping-pong loop.
  brightnessLerp:0.16,   // how fast a cell eases to the sampled brightness (fade in/out)
  visFloor:      22,     // max-channel brightness where a cell begins to appear (0-255)
  visFull:       72,     // …and where it reaches full size

  // --- physics (frame-rate normalised to 60fps) ---
  spring:        0.052,  // pull back toward home (higher = snappier reform)
  damping:       0.84,   // velocity kept per 60fps frame (higher = more fluid drift)
  repelRadiusF:  0.16,   // cursor influence radius = this * min(plate w,h)
  repelStrength: 5.0,    // push acceleration at the cursor centre
  swirl:         0.45,   // tangential component → organic, fluid scatter (0=pure radial)
  maxSpeed:      62,     // px per 60fps frame clamp

  // --- appearance / energy ---
  energyDecay:   0.90,   // how fast a disturbed cell calms (per 60fps frame)
  sizeBoost:     1.7,    // size multiplier at full disturbance energy
  vibrance:      1.18,   // base colour brightness boost
  hotMix:        0.6,    // how far disturbed cells shift toward white-hot

  // --- bloom (screen-space) ---
  bloom:         true,
  bloomScale:    0.5,    // glow buffer resolution factor
  bloomBlur:     3.2,    // px blur radius of the glow
  bloomAlpha:    0.6,    // additive strength of the glow

  // --- life ---
  ambient:       0.08,   // tiny idle drift on top of the swim (fraction of a cell)
  assembleMs:    1500    // materialise-from-scatter duration on load
};

/* Baked offline: the sampling grid, the number of frames in the sheet, and an
   "ever-lit" bitmask marking which cells the fish covers at some point across
   the whole swim. We create one particle per ever-lit cell, so the grid covers
   everywhere the body travels; each cell is invisible while it's dark. */
const GRID_COLS   = 110;
const GRID_ROWS   = 62;
const FRAME_COUNT = 120;
const MASK_B64    = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/gMAAAAAAAAAAAAAAPz/BwAAAAAAAAAAAADw//8DAAAAAAAAAAAAAP///wMAAAAAAAAAAADg////AQAAAAAAAAAAAP7///8AAAAAAAAAAADg/////wAAAAAAAAAAAP////9/AwAAAAAAAAD8//////8BAAAAAAAA8P///////wAAAAAAAAD+//////9/AAAAAAAA8P////////8AAAAAAID/////////f94FAAAA+P///////////w8AADj/////////////BwAA//////////////8AAPz/////////////PwCA//////////////8HAPj//////////////wEA/v////////////9/AID//////////////w8AwP//////////////AwDg/////////////38AAPj/////////////DwAA/P////////////8DAAD+/////////////wEAAP////////////9/AACA/////////////x8AAMD/////////////DwAA4P////////////8DAAD8/////////////wAAAP////////////8/AADg/////////////x8AAPj/////////////BwAA//////////////8BAOD/////////////fwAA+P////////////8/AAD+/////////////w8AwP////////////+/AADw/////////////wcAAPz///////////8BAAAA////////////HwAAAAD6//////////8DAAAAADzm////////HwAAAAAAAPD///////8HAAAAAAAA+P///////wEAAAAAAAD///////9/AAAAAAAAgP///////w8AAAAAAADA/v//////AwAAAAAAAID///////8AAAAAAAAA4P//////HwAAAAAAAADw//////8HAAAAAAAAAAD//////wAAAAAAAAAAwP7///8fAAAAAAAAAAAA+//3/wMAAAAAAAAAAADYP/A/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==";

/* ================================================================ Setup */
const canvas = document.getElementById('stage');
const ctx    = canvas.getContext('2d');
const sheet  = document.getElementById('srcSheet');

// Offscreen buffers: one to decode sheet frames at grid resolution, one for bloom.
const sampleCanvas = document.createElement('canvas');
const sctx = sampleCanvas.getContext('2d', { willReadFrequently: true });
sampleCanvas.width  = GRID_COLS;
sampleCanvas.height = GRID_ROWS;
const glow = document.createElement('canvas');
const gctx = glow.getContext('2d');

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const filterOK = (typeof ctx.filter !== 'undefined');

let dpr = 1, cssW = 0, cssH = 0;     // plate dimensions (css px)
let particles = [];
let rect = { x:0, y:0, w:0, h:0 };   // where the specimen field is drawn
let cellSize = 8, repelR = 120, startTime = 0;
let sampleStep = 1;                  // grid-thinning factor (>=1)
let cols = GRID_COLS, rows = GRID_ROWS;
let firstSample = true;

const frames = [];                   // decoded per-frame pixel buffers (Uint8ClampedArray)
let fpos = 0, dir = 1;               // playback head + ping-pong direction

const pointer = { x:-9999, y:-9999, active:false };

// Decode the base64 bitmask → bytes (bit k set ⇒ cell k=r*GRID_COLS+c is ever lit).
const MASK = (() => {
  const bin = atob(MASK_B64);
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
})();
function everLit(c, r){
  const k = r * GRID_COLS + c;
  return (MASK[k >> 3] >> (k & 7)) & 1;
}

/* Decode every frame of the sprite sheet into its own pixel buffer (once). */
function decodeSheet(){
  for (let i = 0; i < FRAME_COUNT; i++){
    sctx.clearRect(0, 0, GRID_COLS, GRID_ROWS);
    sctx.drawImage(sheet, 0, i * GRID_ROWS, GRID_COLS, GRID_ROWS,
                          0, 0, GRID_COLS, GRID_ROWS);
    frames.push(sctx.getImageData(0, 0, GRID_COLS, GRID_ROWS).data);
  }
}

/* ----------------------------------------------------------------
   Build the fixed grid of particles — one per "ever-lit" cell.
   Each stores its grid (col,row) for sampling, a normalised home
   (u,v), a live colour, an eased brightness, and motion state.
   ---------------------------------------------------------------- */
function buildParticles(){
  sampleStep = Math.max(1, Math.round(GRID_COLS / CONFIG.gridCols));
  cols = Math.floor(GRID_COLS / sampleStep);
  rows = Math.floor(GRID_ROWS / sampleStep);

  particles = [];
  for (let r = 0; r < GRID_ROWS; r += sampleStep){
    for (let c = 0; c < GRID_COLS; c += sampleStep){
      if (!everLit(c, r)) continue;
      particles.push({
        c, r,
        u: (c + 0.5) / GRID_COLS,
        v: (r + 0.5) / GRID_ROWS,
        x: 0, y: 0, vx: 0, vy: 0,
        cr: 0, cg: 0, cb: 0,     // current sampled (boosted) colour
        bri: 0, tBri: 0,         // eased brightness + its target (0..1)
        energy: 0,
        seed: Math.random() * 6.283
      });
    }
  }

  layout();
  firstSample = true;
  sampleFrames();                // prime colours/brightness from the first frame

  // Materialise-on-load: start scattered + glowing; springs pull them home.
  for (const p of particles){
    if (reduceMotion){ p.x = p.hx; p.y = p.hy; p.energy = 0; }
    else { p.x = Math.random() * cssW; p.y = Math.random() * cssH; p.energy = 0.9; }
  }
  startTime = performance.now();
}

/* Fit the 16:9 specimen field into the plate (contain), centre it, set homes. */
function layout(){
  const aspect = GRID_COLS / GRID_ROWS;
  let w = cssW * CONFIG.fitFraction;
  let h = w / aspect;
  if (h > cssH * CONFIG.fitFraction){ h = cssH * CONFIG.fitFraction; w = h * aspect; }
  rect.w = w; rect.h = h;
  rect.x = (cssW - w) / 2;
  rect.y = (cssH - h) / 2;
  cellSize = w / cols;
  repelR = Math.max(70, Math.min(cssW, cssH) * CONFIG.repelRadiusF);
  for (const p of particles){
    p.hx = rect.x + p.u * w;
    p.hy = rect.y + p.v * h;
  }
}

/* Advance the ping-pong playback head (frames, scaled by real time). */
function advance(ds){
  fpos += dir * CONFIG.framesPerSec * (ds / 60);   // ds is in 60fps-frames → ds/60 = seconds
  if (fpos >= FRAME_COUNT - 1){ fpos = FRAME_COUNT - 1; dir = -1; }
  else if (fpos <= 0){ fpos = 0; dir = 1; }
}

/* ----------------------------------------------------------------
   Sample the two nearest sheet frames, blend them, and refresh each
   particle's target colour + brightness. Blending dense adjacent
   frames is smooth and ghost-free.
   ---------------------------------------------------------------- */
function sampleFrames(){
  const i0 = Math.floor(fpos);
  let i1 = i0 + 1; if (i1 > FRAME_COUNT - 1) i1 = FRAME_COUNT - 1;
  const fr = fpos - i0;
  const A = frames[i0], B = frames[i1];
  if (!A || !B) return;
  const V = CONFIG.vibrance;
  const f0 = CONFIG.visFloor, inv = 1 / (CONFIG.visFull - CONFIG.visFloor);
  for (let k = 0; k < particles.length; k++){
    const p = particles[k];
    const i = (p.r * GRID_COLS + p.c) * 4;
    const r = A[i]   + (B[i]   - A[i])   * fr;
    const g = A[i+1] + (B[i+1] - A[i+1]) * fr;
    const b = A[i+2] + (B[i+2] - A[i+2]) * fr;
    let cr = r * V, cg = g * V, cb = b * V;
    p.cr = cr > 255 ? 255 : cr;
    p.cg = cg > 255 ? 255 : cg;
    p.cb = cb > 255 ? 255 : cb;
    const lum = r > g ? (r > b ? r : b) : (g > b ? g : b);  // max channel
    let t = (lum - f0) * inv;
    p.tBri = t < 0 ? 0 : (t > 1 ? 1 : t);
    if (firstSample) p.bri = p.tBri;
  }
  firstSample = false;
}

/* ----------------------------------------------------------------
   Physics step for one particle (semi-implicit Euler, 60fps-normalised
   so it feels identical at 60 / 120 / 144 Hz).
   ---------------------------------------------------------------- */
function step(p, ds, t, ambientOn){
  // Ease brightness toward the freshly sampled target (smooth fade in/out
  // as the body flows onto / off of this cell — no popping).
  p.bri += (p.tBri - p.bri) * (1 - Math.pow(1 - CONFIG.brightnessLerp, ds));

  // Target = home, plus an optional whisper of idle drift.
  let tx = p.hx, ty = p.hy;
  if (ambientOn){
    const amp = cellSize * CONFIG.ambient;
    tx += Math.cos(t * 0.8 + p.seed) * amp;
    ty += Math.sin(t * 1.05 + p.seed * 1.7) * amp;
  }

  // Spring back toward the (drifting) home.
  let ax = (tx - p.x) * CONFIG.spring;
  let ay = (ty - p.y) * CONFIG.spring;

  // Cursor repulsion + tangential swirl → fluid, weightless scatter.
  if (pointer.active){
    const dx = p.x - pointer.x, dy = p.y - pointer.y;
    const d2 = dx*dx + dy*dy;
    if (d2 < repelR * repelR){
      const d = Math.sqrt(d2) || 1e-4;
      let f = 1 - d / repelR;
      f = f * f;
      const force = f * CONFIG.repelStrength;
      const nx = dx / d, ny = dy / d;
      ax += nx * force - ny * force * CONFIG.swirl;
      ay += ny * force + nx * force * CONFIG.swirl;
      if (f > p.energy) p.energy = f;
    }
  }

  p.vx = (p.vx + ax * ds) * Math.pow(CONFIG.damping, ds);
  p.vy = (p.vy + ay * ds) * Math.pow(CONFIG.damping, ds);

  const sp = Math.hypot(p.vx, p.vy);
  if (sp > CONFIG.maxSpeed){ const kk = CONFIG.maxSpeed / sp; p.vx *= kk; p.vy *= kk; }

  p.x += p.vx * ds;
  p.y += p.vy * ds;
  p.energy *= Math.pow(CONFIG.energyDecay, ds);
}

/* Rounded-square path (native roundRect when available, else manual). */
function roundRect(c, x, y, w, h, r){
  if (c.roundRect){ c.beginPath(); c.roundRect(x, y, w, h, r); return; }
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y,     x + w, y + h, r);
  c.arcTo(x + w, y + h, x,     y + h, r);
  c.arcTo(x,     y + h, x,     y,     r);
  c.arcTo(x,     y,     x + w, y,     r);
  c.closePath();
}

/* ----------------------------------------------------------------
   DPR-correct sizing. Floors the backing store to >=1px so a 0-sized
   canvas can never reach drawImage (which throws). The ResizeObserver
   below re-runs this the instant the element gains real layout size.
   ---------------------------------------------------------------- */
function resize(){
  dpr  = Math.min(window.devicePixelRatio || 1, 2.5);
  cssW = canvas.clientWidth;
  cssH = canvas.clientHeight;
  canvas.width  = Math.max(1, Math.round(cssW * dpr));
  canvas.height = Math.max(1, Math.round(cssH * dpr));
  glow.width  = Math.max(1, Math.round(canvas.width  * CONFIG.bloomScale));
  glow.height = Math.max(1, Math.round(canvas.height * CONFIG.bloomScale));
  if (particles.length) layout();
}

/* ----------------------------------------------------------------
   Bloom: downscale the rendered frame, then add it back blurred with
   the "lighter" blend. A few draws regardless of cell count.
   ---------------------------------------------------------------- */
function applyBloom(){
  gctx.setTransform(1, 0, 0, 1, 0, 0);
  gctx.clearRect(0, 0, glow.width, glow.height);
  gctx.drawImage(canvas, 0, 0, canvas.width, canvas.height,
                         0, 0, glow.width, glow.height);
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = CONFIG.bloomAlpha;
  if (filterOK) ctx.filter = `blur(${CONFIG.bloomBlur * dpr}px)`;
  ctx.drawImage(glow, 0, 0, glow.width, glow.height,
                      0, 0, canvas.width, canvas.height);
  ctx.restore();
}

/* ================================================================ Main loop */
let last = performance.now();
function frame(now){
  let ds = (now - last) / (1000 / 60);
  if (ds > 3) ds = 3;
  last = now;

  // Not laid out yet (0 css px): skip drawing but keep the loop alive.
  if (cssW < 1 || cssH < 1){ requestAnimationFrame(frame); return; }

  const t = now * 0.001;

  // Advance + sample the swim (static if reduced motion).
  if (!reduceMotion) advance(ds);
  sampleFrames();

  const ambientOn = !reduceMotion &&
                    (now - startTime) > CONFIG.assembleMs &&
                    CONFIG.ambient > 0;

  // Clear the plate.
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, cssW, cssH);

  const baseS = cellSize * (1 - CONFIG.cellGap);
  const baseR = baseS * CONFIG.cornerRadius;
  const hot   = CONFIG.hotMix;
  const boost = CONFIG.sizeBoost - 1;

  for (let k = 0; k < particles.length; k++){
    const p = particles[k];
    step(p, ds, t, ambientOn);

    // Size grows with the body's brightness here, and swells when disturbed.
    const vis = p.bri;
    const sz  = baseS * vis * (1 + boost * p.energy);
    if (sz < 0.5) continue;                 // dark/undisturbed cells vanish
    const half = sz * 0.5;

    // Colour: the sampled fluorescence, shifted toward white-hot by energy.
    let r = p.cr, g = p.cg, b = p.cb;
    const e = p.energy;
    if (e > 0.001){
      r = r + (255 - r) * hot * e;
      g = g + (255 - g) * hot * e;
      b = b + (255 - b) * hot * e;
    }

    roundRect(ctx, p.x - half, p.y - half, sz, sz, baseR * (sz / baseS));
    ctx.fillStyle = 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
    ctx.fill();
  }

  if (CONFIG.bloom) applyBloom();
  requestAnimationFrame(frame);
}

/* ================================================================ Input */
function setPointer(e){
  const r = canvas.getBoundingClientRect();
  pointer.x = e.clientX - r.left;
  pointer.y = e.clientY - r.top;
  pointer.active = true;
}
canvas.addEventListener('pointermove', setPointer);
canvas.addEventListener('pointerdown', (e) => { setPointer(e); burst(); });
canvas.addEventListener('pointerleave', () => { pointer.active = false; pointer.x = pointer.y = -9999; });
canvas.addEventListener('pointercancel', () => { pointer.active = false; pointer.x = pointer.y = -9999; });

// One-shot radial impulse on click/tap.
function burst(){
  const R = repelR * 1.5;
  for (const p of particles){
    const dx = p.x - pointer.x, dy = p.y - pointer.y;
    const d  = Math.hypot(dx, dy) || 1e-4;
    if (d < R){
      const f = 1 - d / R;
      const imp = f * CONFIG.repelStrength * 3.0;
      p.vx += (dx / d) * imp;
      p.vy += (dy / d) * imp;
      if (f > p.energy) p.energy = f;
    }
  }
}

/* ================================================================ Boot */
function boot(){
  resize();
  decodeSheet();      // decode all frames first…
  buildParticles();   // …so the first sample can prime colours
  last = performance.now();
  requestAnimationFrame(frame);
}

window.addEventListener('resize', () => { resize(); });

// Re-resize when the canvas itself changes size — covers cases a window
// 'resize' never fires for: a container animating open, web fonts settling,
// the element being un-hidden, or running inside a late-sized iframe. It also
// fires once on observe, so a canvas that booted at 0×0 self-heals.
if (typeof ResizeObserver !== 'undefined'){
  new ResizeObserver(() => resize()).observe(canvas);
}

function showError(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '14px sans-serif';
  ctx.fillText('Specimen image failed to load.', 24, 36);
}

if (sheet.complete && sheet.naturalWidth){
  boot();
} else {
  sheet.addEventListener('load', boot, { once: true });
  sheet.addEventListener('error', showError, { once: true });
}
</script>
