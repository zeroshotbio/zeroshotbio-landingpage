<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zebrafish developmental tree — 0–48 hpf</title>
<meta name="description" content="A 0–48 hpf zebrafish developmental tidy tree derived from DanioCell cluster annotations and timed by DanioCell stage metadata, annotated with ZFA.">
<style>
  :root{
    /* Shell tokens are the house set shared with /pipeline and /data_structures. */
    --bg:#131816; --panel:#181f1c; --panel2:#1c2421;
    --fg:#dfe6df; --fg2:#a3b0a6; --fg3:#7d8a81; --rule:#39443e;
    --grid:#dfe6df;

    --accent:#74b0f0;     /* the branch under the pointer — nothing else */
    --bar:#5d6b62;        /* leaf duration bars — recessive ink, not a series */
    --warn:#e0765c;       /* the "not lineage" frame ONLY; never a data series */

    /* ---- ZFA STRUCTURAL KIND ----
       Four hues for the four rungs of ZFA's structural ladder, plus two inks
       for the two classes that are NOT on that ladder (a term ZFA files as
       existing only during development, and no term at all). Absence of hue
       therefore means "off the ladder", which is information rather than a
       leftover.

       These four are slots 1, 4, 5 and 6 of the documented categorical theme,
       and this exact set was chosen by running the palette validator over
       every four-hue subset against BOTH of this page's surfaces on the
       all-pairs list (a tree puts any two marks next to each other, so
       adjacent-pairs would have been the wrong gate). It is the set that
       passes in both modes:
         dark  #131816 — CVD ΔE 6.9 (WARN band), normal-vision ΔE 19.3, contrast PASS
         light #ccd4cb — CVD ΔE 13.0, normal-vision ΔE 19.6, contrast WARN
       Both WARNs are legal only against secondary encoding and visible labels,
       and this chart carries both: every node keeps its MARK SHAPE and its own
       written label, so nothing is ever identified by colour alone. Keep the
       shapes if you touch the hues, and re-run
       dataviz/scripts/validate_palette.js --pairs all before changing either. */
    --k-cell:#3987e5;     /* blue    — is_a* cell */
    --k-tissue:#c98500;   /* yellow  — is_a* portion of tissue */
    --k-multi:#d55181;    /* magenta — is_a* multi-tissue structure */
    --k-organ:#008300;    /* green   — is_a* organ */
    --k-embryo:#a3b0a6;   /* ink     — embryonic / presumptive structure */
    --k-none:#7d8a81;     /* ink     — no ZFA term */
  }
  body.light{
    --bg:#ccd4cb; --panel:#d5dcd3; --panel2:#c3ccc2;
    --fg:#161e19; --fg2:#4c5a52; --fg3:#75827a; --rule:#98a498;
    --grid:#161e19;
    --accent:#1e4c8a; --bar:#8b968c; --warn:#8a3324;

    --k-cell:#2a78d6; --k-tissue:#eda100; --k-multi:#e87ba4; --k-organ:#008300;
    --k-embryo:#4c5a52; --k-none:#75827a;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:ui-monospace,"SF Mono","JetBrains Mono","IBM Plex Mono",Menlo,Consolas,monospace;
       font-size:12px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;
         -webkit-user-select:none;user-select:none}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--rule)}
  ::-webkit-scrollbar-track{background:transparent}
  a{color:var(--accent)}

  .app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}

  header{flex:none;border-bottom:1px solid var(--fg);display:flex;align-items:center;
         gap:14px;padding:8px 12px;flex-wrap:wrap}
  h1{font-size:12px;font-weight:600;margin:0;letter-spacing:.04em;white-space:nowrap}
  .sub{font-size:9.5px;color:var(--fg3);letter-spacing:.05em}
  .ctl{border:1px solid var(--fg);padding:4px 9px;font-size:9px;letter-spacing:.12em;
       text-transform:uppercase;white-space:nowrap;margin-left:auto}
  .ctl:hover,.ctl:focus-visible{background:var(--fg);color:var(--bg)}

  .axis-wrap{flex:none;border-bottom:1px solid var(--rule);overflow:hidden;background:var(--bg)}
  /* The pan surface. Native scrolling stays on (wheel, trackpad, scrollbars);
     the drag handler just moves scrollLeft/scrollTop, so both work together. */
  .scroll{flex:1;overflow:auto;position:relative;cursor:grab}
  .scroll.dragging{cursor:grabbing}
  .scroll.dragging *{pointer-events:none}

  footer{flex:none;border-top:1px solid var(--fg);padding:6px 12px;font-size:9.5px;
         color:var(--fg3);display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  footer b{color:var(--fg2);font-weight:500}

  /* The claim the whole page has to keep honest, said once, in the frame. */
  .disclaimer{border:1px solid var(--warn);color:var(--fg2);padding:3px 8px;font-size:9.5px;
              border-radius:2px}
  .disclaimer b{color:var(--warn);font-weight:600}

  svg{display:block}
  .edge{fill:none;stroke:var(--rule);stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
  .edge.hot{stroke:var(--accent);stroke-width:2}
  .durbar{fill:var(--bar);opacity:.5}
  .durbar.hot{fill:var(--accent);opacity:.9}
  .leader{stroke:var(--rule);stroke-width:1;stroke-dasharray:1 4;opacity:.34}
  .leader.hot{stroke:var(--accent);opacity:1;stroke-dasharray:none}
  /* Fill carries the ZFA kind; the ink stroke keeps every mark visible even
     where its hue sits below 3:1 on the light surface. */
  .mark{stroke:var(--fg);stroke-width:1.1;fill:var(--k-none)}
  .mark.k-cell{fill:var(--k-cell)}
  .mark.k-tissue{fill:var(--k-tissue)}
  .mark.k-multi{fill:var(--k-multi)}
  .mark.k-organ{fill:var(--k-organ)}
  .mark.k-embryo{fill:var(--k-embryo)}
  .mark.k-none{fill:none;stroke:var(--k-none)}
  .mark.hot{stroke:var(--accent);stroke-width:2.2}
  .stop{fill:none;stroke:var(--fg3);stroke-width:1.3;stroke-linecap:round}
  .stop.hot{stroke:var(--accent);stroke-width:1.8}
  .lbl{font-size:10px;fill:var(--fg2);dominant-baseline:middle}
  .lbl.hot{fill:var(--accent);font-weight:600}
  .lbl.prog{font-size:11.5px;fill:var(--fg);letter-spacing:.03em}
  .lbl.tis{font-size:10px;fill:var(--fg2)}
  .lbl.sub{font-size:9px;fill:var(--fg3)}
  /* Internal labels sit over risers and edges. A background-coloured halo under
     the glyphs keeps them readable without moving them off the node they name. */
  .lbl.tis,.lbl.prog{paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round}
  .hit{fill:transparent}
  .band{fill:var(--grid);opacity:.05}
  .bandline{stroke:var(--rule);stroke-width:1;stroke-dasharray:2 4}
  .nodata{fill:var(--grid);opacity:.055}
  .axlbl{font-size:9px;fill:var(--fg3);letter-spacing:.1em;text-transform:uppercase}
  .axnum{font-size:9.5px;fill:var(--fg3)}
  .gridline{stroke:var(--grid);opacity:.07;stroke-width:1}

  .legend{flex:none;display:flex;gap:13px;flex-wrap:wrap;align-items:center;
          padding:6px 12px;font-size:9.5px;color:var(--fg3);border-top:1px solid var(--rule)}
  .legend .li{display:flex;gap:5px;align-items:center;white-space:nowrap}
  .legend svg{overflow:visible}

  /* Hover detail travels with the pointer instead of holding a column open. */
  #tip{position:fixed;z-index:20;pointer-events:none;display:none;max-width:330px;
       background:var(--panel);border:1px solid var(--fg2);padding:7px 9px;
       box-shadow:0 3px 14px rgba(0,0,0,.35);font-size:10.5px;line-height:1.45}
  #tip .t-name{font-size:12.5px;font-weight:600;color:var(--fg);margin-bottom:1px}
  #tip .t-path{font-size:9px;color:var(--fg3);margin-bottom:5px;word-break:break-word}
  #tip .t-row{color:var(--fg2)}
  #tip .t-row b{color:var(--fg);font-weight:600}
  #tip .t-k{color:var(--fg3)}
  #tip .t-sect{border-top:1px solid var(--rule);margin-top:5px;padding-top:4px}
  #tip .t-lin{border-left:2px solid var(--warn);padding-left:6px;margin-top:3px;color:var(--fg2)}
  #tip .t-cl{color:var(--fg3);font-size:9.5px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Zebrafish developmental tree · 0–48 hpf</h1>
    <span class="sub" id="hdr-sub">loading…</span>
    <span class="disclaimer"><b>not lineage</b> — edges are annotation containment</span>
    <button class="ctl" id="btn-theme">light</button>
  </header>

  <div class="axis-wrap"><svg id="axis" height="46"></svg></div>
  <div class="scroll" id="scroll"><svg id="tree"></svg></div>
  <div class="legend" id="legend"></div>

  <footer>
    <span><b>cells</b> <span id="f-cells">—</span></span>
    <span><b>nodes</b> <span id="f-nodes">—</span></span>
    <span><b>observed</b> <span id="f-window">—</span></span>
    <span><b>expression</b> DanioCell (Sur et al. 2023, GSE223922)</span>
    <span><b>ontology</b> ZFA 2026-06-02</span>
    <span>drag to pan · hover for detail</span>
    <span><a href="/dev_tree/NOTES.md">notes &amp; limitations</a></span>
  </footer>
</div>
<div id="tip"></div>
<script src="/dev_tree/tree.js"></script>
</body>
</html>
