<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zebrafish developmental tree — 0–24 hpf</title>
<meta name="description" content="A 0–24 hpf zebrafish developmental tidy tree derived from DanioCell cluster annotations and timed by DanioCell stage metadata, annotated with ZFA.">
<style>
  :root{
    /* Shell tokens are the house set shared with /pipeline and /data_structures. */
    --bg:#131816; --panel:#181f1c; --panel2:#1c2421;
    --fg:#dfe6df; --fg2:#a3b0a6; --fg3:#7d8a81; --rule:#39443e;
    --grid:#dfe6df; --grid-op:.055;

    /* ---- THE CHART'S ONE HUE ----
       This is an EMPHASIS chart, not a categorical one. Every mark is drawn in
       neutral ink; --accent means exactly one thing — "the branch you are
       reading" — and nothing else on the page is allowed to take it.

       Twenty tissue programs cannot be twenty hues: past ~8 slots a categorical
       palette stops being separable under CVD, and generating more hues to fit
       is the failure mode, not the fix. So program identity is carried by
       POSITION and a direct label (every node is labelled), and the ZFA
       structural kind is carried by MARK SHAPE — a secondary encoding that
       survives colour-blindness, greyscale print and forced-colors outright.
       Do not reintroduce a hue per tissue. */
    --accent:#74b0f0;
    --accent-soft:#2e4f6d;
    --bar:#5d6b62;        /* leaf duration bars — recessive ink, not a series */
    --warn:#e0765c;       /* excluded/º caveat marks ONLY; never a data series */
  }
  body.light{
    --bg:#ccd4cb; --panel:#d5dcd3; --panel2:#c3ccc2;
    --fg:#161e19; --fg2:#4c5a52; --fg3:#75827a; --rule:#98a498;
    --grid:#161e19; --grid-op:.06;
    --accent:#1e4c8a; --accent-soft:#a8bdd6;
    --bar:#8b968c; --warn:#8a3324;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:ui-monospace,"SF Mono","JetBrains Mono","IBM Plex Mono",Menlo,Consolas,monospace;
       font-size:12px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;
         -webkit-user-select:none;user-select:none}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--rule)}
  ::-webkit-scrollbar-track{background:transparent}
  a{color:var(--accent)}

  .app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}

  header{flex:none;border-bottom:1px solid var(--fg);display:flex;align-items:center;
         gap:14px;padding:8px 12px;flex-wrap:wrap}
  h1{font-size:12px;font-weight:600;margin:0;letter-spacing:.04em;white-space:nowrap}
  .sub{font-size:9.5px;color:var(--fg3);letter-spacing:.05em}
  .controls{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
  .ctl{border:1px solid var(--fg);padding:4px 9px;font-size:9px;letter-spacing:.12em;
       text-transform:uppercase;white-space:nowrap}
  .ctl:hover,.ctl:focus-visible{background:var(--fg);color:var(--bg)}
  .ctl[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

  .body{display:flex;flex:1;min-height:0}
  .stage{flex:1;min-width:0;display:flex;flex-direction:column}
  .axis-wrap{flex:none;border-bottom:1px solid var(--rule);overflow:hidden;background:var(--bg)}
  .scroll{flex:1;overflow:auto;position:relative}

  aside{width:340px;flex:none;border-left:1px solid var(--fg);overflow-y:auto;
        background:var(--panel);padding:0 0 20px}
  aside h2{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg3);
           margin:0;padding:12px 12px 4px;font-weight:500}
  .det-name{font-size:14px;padding:2px 12px 0;font-weight:600;line-height:1.25}
  .det-path{font-size:9.5px;color:var(--fg3);padding:2px 12px 8px;word-break:break-word}
  .kv{display:grid;grid-template-columns:88px 1fr;gap:2px 8px;padding:4px 12px;font-size:10.5px}
  .kv dt{color:var(--fg3)}
  .kv dd{margin:0}
  .sect{border-top:1px solid var(--rule);margin-top:10px}
  .note{font-size:9.5px;color:var(--fg3);padding:4px 12px 8px;line-height:1.45}
  table.cl{width:100%;border-collapse:collapse;font-size:10px}
  table.cl th{text-align:left;color:var(--fg3);font-weight:400;font-size:9px;
              letter-spacing:.1em;text-transform:uppercase;padding:2px 12px}
  table.cl td{padding:1.5px 12px;vertical-align:top}
  table.cl td.n{text-align:right;color:var(--fg2);white-space:nowrap}
  .zfa-id{color:var(--fg3)}
  .pill{display:inline-block;border:1px solid var(--rule);padding:0 5px;font-size:9px;
        letter-spacing:.08em;text-transform:uppercase;color:var(--fg2)}
  .lineage{border-left:2px solid var(--warn);padding-left:8px;margin:2px 12px 8px;
           font-size:10px;color:var(--fg2)}

  footer{flex:none;border-top:1px solid var(--fg);padding:6px 12px;font-size:9.5px;
         color:var(--fg3);display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  footer b{color:var(--fg2);font-weight:500}

  /* The claim the whole page has to keep honest, said once, in the frame. */
  .disclaimer{border:1px solid var(--warn);color:var(--fg2);padding:3px 8px;font-size:9.5px;
              border-radius:2px}
  .disclaimer b{color:var(--warn);font-weight:600}

  svg{display:block}
  .edge{fill:none;stroke:var(--rule);stroke-width:1.2}
  .edge.hot{stroke:var(--accent);stroke-width:2}
  .durbar{fill:var(--bar);opacity:.55}
  .durbar.hot{fill:var(--accent);opacity:.9}
  .leader{stroke:var(--rule);stroke-width:1;stroke-dasharray:1 4;opacity:.38}
  .leader.hot{stroke:var(--accent);opacity:1;stroke-dasharray:none}
  .mark{fill:var(--bg);stroke:var(--fg2);stroke-width:1.4;vector-effect:non-scaling-stroke}
  .mark.filled{fill:var(--fg2)}
  .mark.hot{stroke:var(--accent);fill:var(--accent)}
  /* the ring a collapsed branch wears — hollow, so the node's own mark shows
     through it. It needs its own class: a CSS `fill` on .mark would beat a
     fill="none" presentation attribute and paint the mark out. */
  .ring{fill:none;stroke:var(--fg3);stroke-width:1.1;stroke-dasharray:2 2}
  .ring.hot{stroke:var(--accent)}
  .cont{fill:none;stroke:var(--fg3);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
  .cont.hot{stroke:var(--accent);stroke-width:1.8}
  .lbl{font-size:10px;fill:var(--fg2);dominant-baseline:middle}
  /* Internal labels sit over risers and duration bars. A background-coloured
     halo under the glyphs is what keeps them readable without moving them off
     the node they name. */
  .lbl.tis,.lbl.prog{paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round}
  .lbl.hot{fill:var(--accent);font-weight:600}
  .lbl.prog{font-size:11px;fill:var(--fg);letter-spacing:.03em}
  .lbl.tis{font-size:10px;fill:var(--fg2)}
  .lbl.sub{font-size:9px;fill:var(--fg3)}
  .hit{fill:transparent;cursor:pointer}
  .band{fill:var(--grid);opacity:.05}
  .bandline{stroke:var(--rule);stroke-width:1;stroke-dasharray:2 4}
  .axlbl{font-size:9px;fill:var(--fg3);letter-spacing:.1em;text-transform:uppercase}
  .axnum{font-size:9.5px;fill:var(--fg3)}
  .gridline{stroke:var(--grid);opacity:.07;stroke-width:1}
  .spark rect{fill:var(--accent)}
  .spark .sax{fill:var(--fg3);font-size:8px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:6px 12px 2px;font-size:9.5px;color:var(--fg3)}
  .legend .li{display:flex;gap:5px;align-items:center}
  .legend svg{overflow:visible}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Zebrafish developmental tree · 0–24 hpf</h1>
    <span class="sub" id="hdr-sub">loading…</span>
    <span class="disclaimer"><b>not lineage</b> — edges are annotation containment</span>
    <div class="controls">
      <button class="ctl" id="btn-time" aria-pressed="true">x = time</button>
      <button class="ctl" id="btn-tidy" aria-pressed="false">x = depth</button>
      <button class="ctl" id="btn-expand">expand all</button>
      <button class="ctl" id="btn-collapse">collapse to tissue</button>
      <button class="ctl" id="btn-theme">light</button>
    </div>
  </header>

  <div class="body">
    <div class="stage">
      <div class="axis-wrap"><svg id="axis" height="46"></svg></div>
      <div class="scroll" id="scroll"><svg id="tree"></svg></div>
      <div class="legend" id="legend"></div>
    </div>
    <aside id="detail">
      <h2>Node</h2>
      <div class="det-name" id="d-name">—</div>
      <div class="det-path" id="d-path">Hover or click a node.</div>
      <div id="d-body"></div>
    </aside>
  </div>

  <footer>
    <span><b>cells</b> <span id="f-cells">—</span></span>
    <span><b>nodes</b> <span id="f-nodes">—</span></span>
    <span><b>observed</b> <span id="f-window">—</span></span>
    <span><b>expression</b> DanioCell (Sur et al. 2023, GSE223922)</span>
    <span><b>ontology</b> ZFA 2026-06-02</span>
    <span><a href="/dev_tree/NOTES.md">notes &amp; limitations</a></span>
  </footer>
</div>
<script src="/dev_tree/tree.js"></script>
</body>
</html>
