<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aquarium to Atlas</title>
<meta name="description" content="Explore the zebrafish single-cell pipeline, from aquarium to labelled atlas.">
<link rel="stylesheet" href="/pipeline/viewer.css">
<script src="/pipeline/viewer.js" defer></script>
</head>
<body>
<header>
  <div class="title">Aquarium to Atlas <span>the zebrafish single-cell pipeline</span></div>
  <nav aria-label="Map controls">
    <button id="stages" aria-expanded="false" aria-controls="index">Stages</button>
    <button id="fit">Fit map</button>
    <button id="out" aria-label="Zoom out">−</button>
    <button id="in" aria-label="Zoom in">+</button>
    <button id="theme">Light</button>
  </nav>
</header>
<main id="stage" tabindex="0" aria-label="Pipeline map. Drag to pan. Pinch or scroll to zoom. Use plus and minus to zoom, arrow keys to pan, or Home to fit.">
  <img id="map" draggable="false" alt="Isometric map of the zebrafish single-cell pipeline, from aquarium to labelled atlas. The Stages menu provides text descriptions.">
  <div id="status" role="status" aria-live="polite">Loading the map…</div>
  <div class="hint" aria-hidden="true">Drag to pan · Scroll or pinch to zoom</div>
</main>
<aside id="index" hidden aria-label="Pipeline stages">
  <div class="indexhead"><h1>The pipeline</h1><button id="close" aria-label="Close stages">×</button></div>
  <p>Five rows, from aquarium to atlas. Choose a stage to find it on the map.</p>
  <div id="list"></div>
  <a class="editlink" href="/pipeline_edit">Edit layout</a>
</aside>
<noscript>This interactive map needs JavaScript. The pipeline follows five rows: biology, library preparation, reads to a matrix, cell filtering, and analysis.</noscript>
</body>
</html>
